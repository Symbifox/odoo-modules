name: CI

# The suite carried ~36 000 lines of tests across 50 modules and nothing ran
# them on push. That made the test suite an invisible asset: it caught no
# regression before a client did, and it answered no question a prospect or an
# auditor might ask. This workflow is the smallest thing that changes that.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # the floor Odoo 18 itself sets: MIN_PY_VERSION

      - name: Install ruff
        run: pip install --quiet ruff==0.16.5

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Gettext shadowing
        # A function that both calls _() and binds _ raises UnboundLocalError
        # where it meant to show a message. Ruff's F823 only proves the narrow
        # case; this covers the family. See tools/check_gettext_shadow.py.
        run: python tools/check_gettext_shadow.py .

      - name: Byte-compile on the supported floor
        # Catches PEP 701 f-strings, which parse on 3.12 and are a SyntaxError at
        # import time on 3.10 and 3.11 — the Python that Ubuntu 22.04 and Debian 12
        # ship, and both are inside the range Odoo 18 declares it supports.
        run: python -m compileall -q -x '(__pycache__|/migrations/)' .

      - name: XML is well-formed
        # Odoo parse chaque fichier de `data` au chargement : un XML mal formé
        # ne se voit qu'à l'installation, neuf minutes plus tard, et il tue le
        # lot entier. Payé une fois, en écrivant un « -- » dans un commentaire
        # XML, ce qui est illégal et qu'aucune autre étape ne regardait.
        # expat, dans la bibliothèque standard, le refuse : pas de dépendance.
        run: |
          python - <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          bad = []
          for f in sorted(pathlib.Path(".").rglob("*.xml")):
              if ".git" in f.parts:
                  continue
              try:
                  ET.parse(f)
              except ET.ParseError as exc:
                  bad.append(f"{f}: {exc}")
          for line in bad:
              print(f"::error::{line}")
          print(f"{len(bad)} malformed XML file(s)")
          sys.exit(1 if bad else 0)
          PY

      - name: Manifest integrity
        # Every file listed in `data` and `demo` must exist. A missing one is
        # invisible until somebody installs the module.
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = []
          for manifest in sorted(pathlib.Path(".").glob("*/__manifest__.py")):
              module = manifest.parent
              try:
                  meta = ast.literal_eval(manifest.read_text(encoding="utf-8"))
              except Exception as exc:
                  bad.append(f"{manifest}: unreadable ({exc})")
                  continue
              for key in ("data", "demo"):
                  for entry in meta.get(key, []):
                      if not (module / entry).is_file():
                          bad.append(f"{module.name}: {key} lists missing {entry}")
              # Same rule for `assets`. A bundle entry that points at a file
              # nobody removed from the manifest is not invisible: the asset
              # compiler logs "Could not get content" on every single page
              # load. project_knowledge_matrix carried two of them for months
              # after its vault moved to bf_credentials, which is 16 ERROR
              # lines per CI run and a broken bundle in production.
              for bundle, entries in (meta.get("assets") or {}).items():
                  for entry in entries:
                      parts = entry if isinstance(entry, (list, tuple)) else [entry]
                      for path in parts:
                          if not isinstance(path, str) or "/" not in path:
                              continue          # 'prepend', 'replace', 'after'
                          if any(c in path for c in "*?["):
                              continue          # a glob resolves at runtime
                          owner = path.split("/", 1)[0]
                          if not (pathlib.Path(owner) / "__manifest__.py").is_file():
                              continue          # core or OCA, not ours to judge
                          if not pathlib.Path(path).is_file():
                              bad.append(
                                  f"{module.name}: assets {bundle} lists missing {path}")
              if not meta.get("license"):
                  bad.append(f"{module.name}: no license in the manifest")
              if not (module / "LICENSE").is_file():
                  bad.append(f"{module.name}: no LICENSE file")
          for line in bad:
              print(f"::error::{line}")
          print(f"{len(bad)} manifest problem(s)")
          sys.exit(1 if bad else 0)
          PY

  prepare:
    name: Select testable modules
    needs: lint
    # ⚠️ Runs inside odoo:18, not on the bare runner. The selector resolves each
    # module's dependency closure against the addons paths it is given, and most
    # of those dependencies are core Odoo (mail, project, web, portal…). On a
    # runner without Odoo installed every module reads as blocked, the chunk
    # list comes out empty, and the matrix that consumes it fails the run with
    # nothing to point at. That is exactly what the first run did.
    runs-on: ubuntu-latest
    container:
      image: odoo:18
      options: --user root
    defaults:
      run:
        # ⚠️ In a container job GitHub Actions does NOT default to bash — it
        # falls back to `sh -e {0}`, and /bin/sh is dash on Ubuntu 24.04, which
        # this image is. The steps below opened with `set -o pipefail` and died
        # on "Illegal option -o pipefail" before running a single line. Declared
        # at job level rather than per step so a step added later cannot walk
        # into it again. GitHub's own bash invocation already carries
        # `-o pipefail`, so no step needs to set it.
        shell: bash
    outputs:
      chunks: ${{ steps.pick.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/oca-addons
      - id: pick
        run: |
          # ⚠️ Ask Python where Odoo is rather than hardcoding a path. The run
          # before this one passed /usr/lib/python3/dist-packages/odoo/addons,
          # which is where our own images put it; the official image does not
          # have to agree, and a wrong path reads exactly like "no module is
          # testable" with nothing pointing at the cause.
          CORE=$(python3 -c 'import odoo, os; print(os.path.join(os.path.dirname(odoo.__file__), "addons"))')
          echo "core addons: $CORE ($(ls "$CORE" | wc -l) modules)"
          CHUNKS=$(python3 tools/ci_test_modules.py --chunks 6 --repo . . oca "$CORE")
          echo "$CHUNKS"
          if [ "$CHUNKS" = "[]" ]; then
            echo "::error::no module is testable — suspect the addons path, not the code"
            exit 1
          fi
          echo "chunks=$CHUNKS" >> "$GITHUB_OUTPUT"

  test:
    name: Tests
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: odoo:18
      options: --user root
    defaults:
      run:
        # ⚠️ In a container job GitHub Actions does NOT default to bash — it
        # falls back to `sh -e {0}`, and /bin/sh is dash on Ubuntu 24.04, which
        # this image is. The steps below opened with `set -o pipefail` and died
        # on "Illegal option -o pipefail" before running a single line. Declared
        # at job level rather than per step so a step added later cannot walk
        # into it again. GitHub's own bash invocation already carries
        # `-o pipefail`, so no step needs to set it.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.prepare.outputs.chunks) }}
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/oca-addons

      - name: Python dependencies
        # ⚠️ pyOpenSSL has to move WITH cryptography. The image ships
        # cryptography 41.0.7 and pyOpenSSL 23.2.0 as distro packages;
        # requirements.txt floors cryptography at 42, so pip puts a modern one
        # in /usr/local and the distro pyOpenSSL — built against the old C
        # bindings — then raises `module 'lib' has no attribute 'GEN_EMAIL'` on
        # import. Odoo imports it while loading `base`, so every chunk died with
        # "Couldn't load module base" and nothing pointed back at pip.
        # `--upgrade` is load-bearing: a bare `pip install pyOpenSSL` is
        # satisfied by the 23.2.0 already there and changes nothing.
        #
        # ⚠️ `--ignore-installed` is load-bearing too. Replacing a distro
        # package makes pip try to uninstall it first, and it cannot: the
        # dpkg-installed copy has no RECORD file, so pip stops with
        # "Cannot uninstall cryptography 41.0.7 ... installed by debian".
        # Installing alongside is enough — /usr/local precedes
        # /usr/lib/python3/dist-packages on sys.path, so the new copy wins.
        run: |
          pip install --break-system-packages --quiet --ignore-installed -r requirements.txt
          pip install --break-system-packages --quiet --ignore-installed --upgrade pyOpenSSL

      - name: Install and test
        # One database per chunk. --test-tags restricts the run to this chunk's
        # own tests: without it Odoo also re-runs the core tests of every
        # dependency it pulled in, which triples the run for no added signal.
        run: |
          DB="ci_$(echo '${{ matrix.chunk }}' | md5sum | cut -c1-10)"
          TAGS=$(echo '${{ matrix.chunk }}' | tr ',' '\n' | sed 's|^|/|' | paste -sd,)
          CORE=$(python3 -c 'import odoo, os; print(os.path.join(os.path.dirname(odoo.__file__), "addons"))')
          odoo -d "$DB" \
            --addons-path="$CORE","$GITHUB_WORKSPACE","$GITHUB_WORKSPACE/oca" \
            --db_host=db --db_user=odoo --db_password=odoo \
            --http-port=8069 --gevent-port=8072 \
            -i '${{ matrix.chunk }}' \
            --test-enable --test-tags="$TAGS" \
            --without-demo=all --stop-after-init --log-level=warn 2>&1 | tee run.log
          # Odoo exits 0 even when a test fails, so the log is the verdict --
          # but NOT any ERROR line in it. ⚠️ The first version of this step
          # failed on every ERROR, and that reads a lot of things as failures
          # that are not: a test asserting that a constraint raises logs its
          # own `odoo.sql_db: bad query`, the asset compiler complains about a
          # file another module declares, and a defensive collector logs the
          # failure it just caught. The 2026-09-03 run had a chunk marked red
          # with 38 such lines and zero failing tests.
          #
          # These two lines are Odoo's own verdicts, and it writes them ONLY
          # when a test did not pass: modules/loading.py:320 (per module) and
          # tests/result.py:198 (per run). An install that dies never reaches
          # here -- the runner's `-eo pipefail` fails the step on odoo's own
          # non-zero exit.
          VERDICT='(Module [a-zA-Z0-9_.]+: [0-9]+ failures, [0-9]+ errors of|[0-9]+ failed, [0-9]+ error\(s\) of [0-9]+ tests)'
          if grep -qE "$VERDICT" run.log; then
            echo "::error::test failures in chunk ${{ matrix.chunk }}"
            grep -E "$VERDICT" run.log | head -20
            grep -E '(FAIL|ERROR): [A-Za-z_]+\.[A-Za-z_]+' run.log | head -50
            exit 1
          fi
          if grep -qE '^[0-9-]+ [0-9:,]+ [0-9]+ CRITICAL' run.log; then
            echo "::error::critical error in chunk ${{ matrix.chunk }}"
            grep -E '^[0-9-]+ [0-9:,]+ [0-9]+ CRITICAL' run.log | head -20
            exit 1
          fi
          # The rest stays visible without deciding the run: silence would
          # let a real regression hide behind "it was noisy before too".
          if grep -qE '^[0-9-]+ [0-9:,]+ [0-9]+ ERROR' run.log; then
            echo "::notice::${{ matrix.chunk }}: $(grep -cE '^[0-9-]+ [0-9:,]+ [0-9]+ ERROR' run.log) ERROR line(s) in the log, no failing test"
            grep -E '^[0-9-]+ [0-9:,]+ [0-9]+ ERROR' run.log | head -30
          fi
