

<t t-set="company" t-value="(object.type_id.company_id) or user.company_id"/>
<t t-set="brand_primary" t-value="(company and company.report_brand_primary) or '#714B67'"/>
<t t-set="brand_dark" t-value="(company and company.report_brand_dark) or '#212529'"/>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" t-attf-style="background-color:{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_dark) or brand_dark }};">
    <tbody>
        <tr>
            <td align="center" style="padding:24px;">
                <table cellspacing="0" cellpadding="0" border="0" width="100%" align="center" role="presentation">
                    <tbody>
                        <tr>
                            <td>
                                <br/>
                                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px; max-width:600px; margin:0 auto; background-color:#ffffff; border-radius:12px; border:1px solid #e5e7eb; border-collapse:collapse;">
                                    <tbody>
                                        <tr>
                                            <td t-attf-style="background-color:{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_dark) or brand_dark }}; padding:16px 24px; border-radius:12px 12px 0 0;">
                                                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                                    <tbody>
                                                        <tr>
                                                            <td align="left" style="color:#FFFFFF; font-family:'Lexend','Segoe UI',Arial,sans-serif; font-size:16px; font-weight:600;">
                                                                <a t-attf-href="{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_website_url) or 'https://www.bluefoxconsultant.com' }}" style="text-decoration:none;">
                                                                    <img t-attf-src="{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_logo_url) or 'https://www.bluefoxconsultant.com/web/image/website/1/logo/Blue%20Fox?unique=803cc14' }}" t-attf-alt="{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_name) or 'Blue Fox' }}" style="height:48px; width:auto; display:block; border:0;"/>
                                                                </a>
                                                            </td>
                                                            <td align="right" style="color:#E6EDF3; font-family:'Lexend','Segoe UI',Arial,sans-serif; font-size:22px; font-weight:800; letter-spacing:0.2px;">
                                                                Rendez-vous
                                                            </td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td t-attf-style="height:4px; line-height:4px; background-color:{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_primary) or brand_primary }};">&#160;</td>
                                        </tr>
                                        <tr>
                                            <td style="padding:24px; font-family:'Lexend','Segoe UI',Arial,sans-serif;">
                                                <p style="font-size:16px; line-height:26px; color:#374151; margin:0 0 16px 0;">
                                                    Bonjour <t t-out="object.partner_id.name or ''">Client</t>,
                                                </p>
                                                <p style="font-size:16px; line-height:26px; color:#374151; margin:0 0 20px 0;">
                                                    Votre rendez-vous a &#233;t&#233; confirm&#233; avec succ&#232;s.
                                                </p>
                                                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:16px 0 20px 0; border:1px solid #e5e7eb; border-radius:8px; border-collapse:separate;">
                                                    <tbody>
                                                        <tr>
                                                            <td style="padding:12px 16px; background-color:#f9fafb; border-bottom:1px solid #e5e7eb; color:#6B7280; font-size:14px; width:35%;">Type</td>
                                                            <td style="padding:12px 16px; background-color:#f9fafb; border-bottom:1px solid #e5e7eb; font-size:14px; font-weight:600; color:#374151;"><t t-out="object.type_id.name or ''">Consultation</t></td>
                                                        </tr>
                                                        <tr>
                                                            <td style="padding:12px 16px; border-bottom:1px solid #e5e7eb; color:#6B7280; font-size:14px;">Date</td>
                                                            <td style="padding:12px 16px; border-bottom:1px solid #e5e7eb; font-size:14px; font-weight:600; color:#374151;"><t t-out="object.start_date_local"/></td>
                                                        </tr>
                                                        <tr>
                                                            <td style="padding:12px 16px; border-bottom:1px solid #e5e7eb; color:#6B7280; font-size:14px;">Heure</td>
                                                            <td style="padding:12px 16px; border-bottom:1px solid #e5e7eb; font-size:14px; font-weight:600; color:#374151;"><t t-out="object.start_time_local"/><t t-if="object.get_timezone_label()"><span style="font-weight:400; color:#6B7280;"> (<t t-out="object.get_timezone_label()"/>)</span></t></td>
                                                        </tr>
                                                        <t t-if="object.videocall_location">
                                                            <tr>
                                                                <td style="padding:12px 16px; border-bottom:1px solid #e5e7eb; color:#6B7280; font-size:14px;">Vid&#233;oconf&#233;rence</td>
                                                                <td style="padding:12px 16px; border-bottom:1px solid #e5e7eb; font-size:14px;">
                                                                    <a t-att-href="object.videocall_location" t-attf-style="color:{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_primary) or brand_primary }}; text-decoration:none; font-weight:600;">Rejoindre la r&#233;union</a>
                                                                </td>
                                                            </tr>
                                                        </t>
                                                        <t t-if="object.location">
                                                            <tr>
                                                                <td style="padding:12px 16px; color:#6B7280; font-size:14px;">Lieu</td>
                                                                <td style="padding:12px 16px; font-size:14px; color:#374151;"><t t-out="object.location or ''">Bureau</t></td>
                                                            </tr>
                                                        </t>
                                                    </tbody>
                                                </table>
                                                <t t-out="object.bf_extra_cta_html()"/>
                                                <t t-if="object.access_token">
                                                <p style="text-align:center; margin:24px 0 16px 0;">
                                                    <a t-attf-href="{{ object.get_base_url() }}/appointment/b/{{ object.id }}/{{ object.access_token }}"
                                                       t-attf-style="background-color:{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_primary) or brand_primary }}; color:#ffffff; padding:12px 32px; text-decoration:none; border-radius:6px; font-weight:600; font-size:14px; display:inline-block;">
                                                        Voir mon rendez-vous
                                                    </a>
                                                </p>
                                                </t>
                                                <p style="font-size:13px; line-height:20px; color:#6B7280; margin:16px 0 0 0;">
                                                    Pour toute question, contactez-nous &#224;
                                                    <a t-attf-href="mailto:{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_support_email) or 'service@example.com' }}" t-attf-style="color:{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_primary) or brand_primary }}; text-decoration:none;"><t t-out="(object.type_id.company_id and object.type_id.company_id.appointment_brand_support_email) or 'service@example.com'"/></a>
                                                    ou appelez le
                                                    <a t-attf-href="tel:{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_support_phone) or '+15555555555' }}" t-attf-style="color:{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_primary) or brand_primary }}; text-decoration:none;"><t t-out="(object.type_id.company_id and object.type_id.company_id.appointment_brand_support_phone_display) or '555-555-5555'"/></a>.
                                                </p>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td style="height:1px; line-height:1px; background-color:#E5E7EB;">&#160;</td>
                                        </tr>
                                        <tr>
                                            <td style="padding:16px 24px 24px 24px; background-color:#FFFFFF; border-radius:0 0 12px 12px;">
                                                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                                    <tbody>
                                                        <tr>
                                                            <td style="font-family:'Lexend','Segoe UI',Arial,sans-serif; font-size:12px; color:#6B7280;">
                                                                <strong t-attf-style="color:{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_dark) or brand_dark }};">Rendez-vous par <t t-out="(object.type_id.company_id and object.type_id.company_id.appointment_brand_name) or 'Blue Fox'"/></strong><br/>
                                                                <t t-out="(object.type_id.company_id and object.type_id.company_id.appointment_brand_tagline) or 'Solutions éthiques et souveraines pour vos données.'"/>
                                                            </td>
                                                            <td align="right" style="font-family:'Lexend','Segoe UI',Arial,sans-serif; font-size:12px; color:#9CA3AF;">
                                                                <a t-attf-href="{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_privacy_url) or 'https://www.bluefoxconsultant.com/r/politique-de-confidentialite' }}" style="color:#9CA3AF; text-decoration:underline;">Confidentialit&#233;</a>
                                                                <span style="color:#9CA3AF;"> | </span>
                                                                <a t-attf-href="{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_terms_url) or 'https://www.bluefoxconsultant.com/r/termes-et-conditions' }}" style="color:#9CA3AF; text-decoration:underline;">Conditions</a>
                                                            </td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px; max-width:600px; margin:12px auto 0;">
                                    <tbody>
                                        <tr>
                                            <td t-attf-style="height:3px; line-height:3px; background-color:{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_primary) or brand_primary }}; width:50%;">&#160;</td>
                                            <td t-attf-style="height:3px; line-height:3px; background-color:{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_dark) or brand_dark }}; width:50%;">&#160;</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </td>
        </tr>
    </tbody>
</table>
