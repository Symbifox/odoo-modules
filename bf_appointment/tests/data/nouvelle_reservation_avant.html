

<t t-set="company" t-value="(object.type_id.company_id) or user.company_id"/>
<t t-set="brand_primary" t-value="(company and company.report_brand_primary) or '#714B67'"/>
<t t-set="brand_dark" t-value="(company and company.report_brand_dark) or '#212529'"/>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" t-attf-style="background-color:{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_dark) or brand_dark }};">
    <tbody><tr><td align="center" style="padding:24px;">
        <table cellspacing="0" cellpadding="0" border="0" width="100%" align="center" role="presentation"><tbody><tr><td><br/>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px; max-width:600px; margin:0 auto; background-color:#ffffff; border-radius:12px; border:1px solid #e5e7eb; border-collapse:collapse;">
                <tbody>
                    <tr><td t-attf-style="background-color:{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_dark) or brand_dark }}; padding:16px 24px; border-radius:12px 12px 0 0;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tbody><tr><td align="left"><a t-attf-href="{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_website_url) or 'https://www.bluefoxconsultant.com' }}" style="text-decoration:none;"><img t-attf-src="{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_logo_url) or 'https://www.bluefoxconsultant.com/web/image/website/1/logo/Blue%20Fox?unique=803cc14' }}" t-attf-alt="{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_name) or 'Blue Fox' }}" style="height:48px; width:auto; display:block; border:0;"/></a></td><td align="right" style="color:#E6EDF3; font-family:'Lexend','Segoe UI',Arial,sans-serif; font-size:22px; font-weight:800;">Nouveau RDV</td></tr></tbody></table></td></tr>
                    <tr><td t-attf-style="height:4px; line-height:4px; background-color:{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_primary) or brand_primary }};">&#160;</td></tr>
                    <tr><td style="padding:24px; font-family:'Lexend','Segoe UI',Arial,sans-serif;">
                        <p style="font-size:16px; line-height:26px; color:#374151; margin:0 0 16px 0;">Bonjour <t t-out="object.user_id.name or ''"/>,</p>
                        <p style="font-size:16px; line-height:26px; color:#374151; margin:0 0 20px 0;">Un nouveau rendez-vous a &#233;t&#233; pris par <strong><t t-out="object.partner_id.name or ''"/></strong>.</p>
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:16px 0 20px 0; border:1px solid #e5e7eb; border-radius:8px; border-collapse:separate;"><tbody>
                            <tr><td style="padding:12px 16px; background-color:#f9fafb; border-bottom:1px solid #e5e7eb; color:#6B7280; font-size:14px; width:35%;">Type</td><td style="padding:12px 16px; background-color:#f9fafb; border-bottom:1px solid #e5e7eb; font-size:14px; font-weight:600; color:#374151;"><t t-out="object.type_id.name or ''"/></td></tr>
                            <tr><td style="padding:12px 16px; border-bottom:1px solid #e5e7eb; color:#6B7280; font-size:14px;">Client</td><td style="padding:12px 16px; border-bottom:1px solid #e5e7eb; font-size:14px; color:#374151;"><t t-out="object.partner_id.name or ''"/> (<t t-out="object.partner_id.email or ''"/>)</td></tr>
                            <t t-if="object.partner_id.phone"><tr><td style="padding:12px 16px; border-bottom:1px solid #e5e7eb; color:#6B7280; font-size:14px;">T&#233;l&#233;phone</td><td style="padding:12px 16px; border-bottom:1px solid #e5e7eb; font-size:14px; color:#374151;"><t t-out="object.partner_id.phone or ''"/></td></tr></t>
                            <tr><td style="padding:12px 16px; border-bottom:1px solid #e5e7eb; color:#6B7280; font-size:14px;">Date</td><td style="padding:12px 16px; border-bottom:1px solid #e5e7eb; font-size:14px; font-weight:600; color:#374151;"><t t-out="object.start_date_local"/></td></tr>
                            <tr><td style="padding:12px 16px; border-bottom:1px solid #e5e7eb; color:#6B7280; font-size:14px;">Heure</td><td style="padding:12px 16px; border-bottom:1px solid #e5e7eb; font-size:14px; font-weight:600; color:#374151;"><t t-out="object.start_time_local"/><t t-if="object.get_timezone_label()"><span style="font-weight:400; color:#6B7280;"> (<t t-out="object.get_timezone_label()"/>)</span></t></td></tr>
                            <tr><td style="padding:12px 16px; border-bottom:1px solid #e5e7eb; color:#6B7280; font-size:14px;">Dur&#233;e</td><td style="padding:12px 16px; border-bottom:1px solid #e5e7eb; font-size:14px; color:#374151;"><t t-out="object.get_duration_display()"/></td></tr>
                            <t t-if="object.videocall_location"><tr><td style="padding:12px 16px; color:#6B7280; font-size:14px;">Vid&#233;o</td><td style="padding:12px 16px; font-size:14px;"><a t-att-href="object.videocall_location" t-attf-style="color:{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_primary) or brand_primary }}; text-decoration:none; font-weight:600;">Rejoindre la r&#233;union</a></td></tr></t>
                        </tbody></table>
                        <t t-if="object.intake_answer_ids">
                        <p t-attf-style="font-size:14px; color:{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_dark) or brand_dark }}; font-weight:600; margin:24px 0 8px 0;">R&#233;ponses au formulaire</p>
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 20px 0; border:1px solid #e5e7eb; border-radius:8px; border-collapse:separate;"><tbody>
                            <t t-foreach="object.intake_answer_ids" t-as="ans">
                                <tr><td style="padding:10px 16px; color:#6B7280; font-size:13px; width:35%; border-bottom:1px solid #e5e7eb;"><t t-out="ans.field_name or ''"/></td><td style="padding:10px 16px; color:#374151; font-size:13px; border-bottom:1px solid #e5e7eb;"><t t-out="ans.value or ''"/></td></tr>
                            </t>
                        </tbody></table>
                        </t>
                        <p style="text-align:center; margin:24px 0 16px 0;">
                            <a t-attf-href="{{ object.get_base_url() }}/odoo/all-bookings/{{ object.id }}" t-attf-style="background-color:{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_primary) or brand_primary }}; color:#ffffff; padding:12px 32px; text-decoration:none; border-radius:6px; font-weight:600; font-size:14px; display:inline-block;">Ouvrir dans Odoo</a>
                        </p>
                    </td></tr>
                    <tr><td style="height:1px; line-height:1px; background-color:#E5E7EB;">&#160;</td></tr>
                    <tr><td style="padding:16px 24px 24px 24px; background-color:#FFFFFF; border-radius:0 0 12px 12px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tbody><tr><td style="font-family:'Lexend','Segoe UI',Arial,sans-serif; font-size:12px; color:#6B7280;"><strong t-attf-style="color:{{ (object.type_id.company_id and object.type_id.company_id.appointment_brand_dark) or brand_dark }};">Notification interne <t t-out="(object.type_id.company_id and object.type_id.company_id.appointment_brand_name) or 'Blue Fox'"/></strong></td></tr></tbody></table></td></tr>
                </tbody>
            </table>
        </td></tr></tbody></table>
    </td></tr></tbody>
</table>
