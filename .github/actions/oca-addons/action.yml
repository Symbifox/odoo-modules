name: OCA addons
description: >-
  Shallow-clone the OCA repositories that Symbifox modules depend on, into a
  single ./oca directory that goes on the addons path.

# A large share of the test suites — including the largest — sit behind one of
# these dependencies. Without the clones CI would run the easy part and report
# green, which is worse than not running at all.
#
# Two of the dependencies are not OCA: om_account_followup (Odoo Mates),
# collabora_odoo (Collabora Productivity). They are cloned the same way, by
# commit, under their own owner. 🔴 Until 2026-10-16 om_account_followup was
# missing, and since bluefox_branding depends on it, so does every module that
# depends on bluefox_branding: 52 modules, hosting_management and the whole
# bf_school_* family among them, were skipped as "depends on missing" while
# the run still showed green.

runs:
  using: composite
  steps:
    - name: Ensure git is available
      shell: bash
      # This action also runs inside the odoo:18 container, which does not ship
      # git. actions/checkout does not need it (it falls back to a REST
      # tarball), so the gap only shows up here, as `git: command not found`.
      run: |
        command -v git >/dev/null && exit 0
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends git >/dev/null
        git --version

    - name: Clone OCA dependencies
      shell: bash
      # 🔴 Pinned by commit, not by branch. The tip of 18.0 moves under us:
      # mail_composer_cc_bcc 18.0.1.0.3 (2026) rewrote the Bcc path and now
      # refuses to send ("Could not determine the recipient of this email")
      # where bf_email_management expects the 18.0.1.0.1 behaviour that every
      # tenant runs. A floating clone made CI test a combination no tenant
      # has, and turned an upstream release into a red run with nothing of
      # ours changed. Each SHA is the commit whose code matches the copy
      # deployed on the Blue Fox tenant (helpdesk: the last commit carrying
      # the deployed version, 18.0.1.7.0). Moving one is a deliberate change,
      # made together with the tenants, never a side effect of a CI run.
      run: |
        set -euo pipefail
        mkdir -p oca
        clone() {  # repo (owner/name, OCA when no owner), commit, modules to keep
          local repo="$1" sha="$2"; shift 2
          [[ "$repo" == */* ]] || repo="OCA/$repo"
          local dir; dir="$(mktemp -d)"
          git -C "$dir" init --quiet
          git -C "$dir" fetch --quiet --depth 1 \
            "https://github.com/${repo}.git" "$sha"
          git -C "$dir" checkout --quiet FETCH_HEAD
          for module in "$@"; do
            if [ -d "$dir/$module" ]; then
              cp -r "$dir/$module" oca/
            else
              echo "::error::${repo}@${sha} has no ${module}"
              exit 1
            fi
          done
          rm -rf "$dir"
        }
        clone helpdesk cfc684ba983285c7960565bdde2464c420884a29 helpdesk_mgmt helpdesk_mgmt_project helpdesk_mgmt_merge helpdesk_ticket_related  # 18.0.1.7.0 / 18.0.1.0.0 / 18.0.1.0.1 / 18.0.1.0.0
        clone contract cca86f084940ce225192b02efb8b19f37f1fccfd contract                             # 18.0.2.0.3
        clone donation 1ebd3d2a898f5d8ec1dda85dfcac8725c8fd5e6e donation donation_base               # 18.0.1.3.0 / 18.0.1.2.0
        clone mail     5795b4ab9eacc0b38761434cc7adeb2e1b34ccb7 mail_composer_cc_bcc mail_quoted_reply  # 18.0.1.0.1 / 18.0.1.0.0
        # ⚠️ No upstream commit matches the tenants' mail_tracking 18.0.1.0.2: theirs
        # carries two local lines in models/mail_mail.py (a single address given
        # as a string is wrapped in a list). 34ff63a9 is the same code without them.
        clone mail     34ff63a913bc5399283fbb87a0046465ee39f6d3 mail_tracking                        # 18.0.1.0.2
        clone calendar 737966814ffab280957677bdf0cc5a002c3284c6 resource_booking                     # 18.0.1.0.2
        clone web      6a57da6d8a381142f16df2ea1e3491e94d7b444a web_calendar_slot_duration           # 18.0.1.0.0
        # Odoo Mates publishes no tag. ad420986 carries the same code as the
        # tenants' 1.0.1; only the translation files differ (theirs came from
        # the Apps Store archive). bluefox_branding rebrands its templates.
        clone odoomates/odooapps ad4209864c95a89bd0855aa7434e4e903bcd24d2 om_account_followup  # 1.0.1
        clone CollaboraOnline/collabora_odoo a5583c0b37844c6b1b637e88e76c2efcef1f64cd collabora_odoo  # 18.0.0.2.2, MPL-2.0
        echo "addons in ./oca:"; ls oca
